name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest tests -v

  distribution:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,release]"
      - run: ruff check general_mini_agent tests demo
      - run: python -m compileall -q general_mini_agent demo tests
      - run: rm -rf dist/
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel and verify
        run: |
          set -euo pipefail
          EXPECTED_VERSION="$(python -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          export EXPECTED_VERSION
          VENV_PATH="$RUNNER_TEMP/package-smoke"
          python -m venv "$VENV_PATH"
          "$VENV_PATH/bin/python" -m pip install dist/*.whl
          cd "$RUNNER_TEMP"
          "$VENV_PATH/bin/python" - <<'PY'
          import os
          import sys
          from importlib.metadata import version
          from pathlib import Path

          import general_mini_agent
          from general_mini_agent import Agent, Debate, LLM, MemoryQuery

          installed_version = version("general-mini-agent-framework")
          assert installed_version == os.environ["EXPECTED_VERSION"]
          assert Path(general_mini_agent.__file__).resolve().is_relative_to(Path(sys.prefix).resolve())
          assert all((Agent, Debate, LLM, MemoryQuery))
          print(f"Wheel installation verified: version {installed_version}")
          PY
