name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest tests -v

  distribution:
    name: Build and verify distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev,release]"
      - run: ruff check core tests demo
      - run: python -m compileall -q core demo tests
      - run: rm -rf dist/
      - run: python -m build
      - run: python -m twine check dist/*
      - name: Install wheel and verify
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/python -m pip install dist/*.whl
          /tmp/venv/bin/python -c "
          from importlib.metadata import version
          from core import Agent, Debate, LLM, MemoryQuery
          assert version('general-mini-agent-framework') == '0.4.1'
          print('Wheel installation verified: version 0.4.1')
          "