[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "general-mini-agent-framework"
version = "0.8.0"
description = "A lightweight, composable Python Agent core for OpenAI-compatible tool calling."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0", "ruff>=0.6.0"]
demo = ["python-dotenv>=1.0.0"]
memory = ["chromadb>=0.5.0"]
release = ["build>=1.0.0", "twine>=5.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["general_mini_agent", "core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
